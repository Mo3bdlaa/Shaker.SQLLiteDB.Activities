name: release

# Publishes a GitHub Release with the activity package attached, whenever a
# version tag is pushed:
#     git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to publish, for example v1.0.0. It is created from the branch you run this on if it does not exist yet.'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            8.0.x

      - name: Work out the version
        id: version
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: dotnet build Shaker.SQLLiteDB.Activities.sln -c Release -p:Version=${{ steps.version.outputs.version }}

      - name: Test
        run: dotnet test tests/Shaker.SQLLiteDB.Activities.Tests/Shaker.SQLLiteDB.Activities.Tests.csproj -c Release --no-build

      - name: Pack
        run: dotnet pack src/Shaker.SQLLiteDB.Activities/Shaker.SQLLiteDB.Activities.csproj -c Release --no-build -p:Version=${{ steps.version.outputs.version }}

      - name: Checksums
        shell: bash
        run: |
          cd artifacts
          sha256sum *.nupkg *.snupkg > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Check the package layout
        shell: bash
        run: |
          # A UiPath activity package has to ship lib/net461 and lib/net6.0-windows7.0, and must not
          # carry its own System.Activities: the Studio and robot hosts provide that one.
          cd artifacts
          unzip -l *.nupkg | grep -E 'lib/' || true
          unzip -l *.nupkg | grep -q 'lib/net461/' || { echo 'missing lib/net461'; exit 1; }
          unzip -l *.nupkg | grep -q 'lib/net6.0-windows7.0/' || { echo 'missing lib/net6.0-windows7.0'; exit 1; }
          unzip -p *.nupkg '*.nuspec' | grep -q 'UiPath.Workflow.Runtime' && { echo 'System.Activities must not be a package dependency'; exit 1; }
          echo 'package layout ok'

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          cat > notes.md <<'NOTES'
          UiPath activity library for SQLite. The SQLite engine ships inside the package
          (SQLitePCLRaw, SQLCipher build), so a robot needs no ODBC driver, no
          System.Data.SQLite install and no machine level configuration, and encrypted
          databases work out of the box.

          **Installing in Studio**

          1. Download `Shaker.SQLLiteDB.Activities.VERSION_PLACEHOLDER.nupkg` below into a local folder.
          2. Studio: Manage Packages -> Settings -> add that folder as a package source.
          3. Install **Shaker.SQLLiteDB.Activities**. The activities show up under Shaker -> SQLite.

          Works in both **Windows - Legacy** (`net461`) and **Windows** (`net6.0`) projects.

          **What is in it**

          * Many readers at once (WAL) plus `SQLite Parallel Query`.
          * One writer at a time, serialized through a lock file that works across
            processes and machines, with retries for the busy/locked errors.
          * Connect, transaction and write lock scopes; query, scalar, non query, script
            and batch; bulk insert with ignore/replace/upsert.
          * Export to CSV, XLSX and JSON, and CSV import. The .xlsx writer is built into
            the package, so no Open XML library is pulled into your project.
          * Schema inspection, create table, maintenance, online backup, attach.
          * AES-256 encryption: set `Password`, or use `SQLite Set Password` to encrypt,
            re-key or decrypt a database.

          Verify the download against `SHA256SUMS.txt`.
          NOTES
          sed -i "s/VERSION_PLACEHOLDER/${VERSION}/g" notes.md

          # --target creates the tag from this commit when it does not exist yet, so the
          # release can also be published straight from the Actions tab.
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "Shaker SQLite Activities $TAG" \
            --notes-file notes.md \
            artifacts/*.nupkg artifacts/*.snupkg artifacts/SHA256SUMS.txt
