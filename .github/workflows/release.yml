name: release

# Publishes a GitHub Release with the activity package attached, whenever a
# version tag is pushed:
#     git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to publish, for example v1.0.0. It is created from the branch you run this on if it does not exist yet.'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            8.0.x

      - name: Work out the version
        id: version
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: dotnet build Shaker.SQLLiteDB.Activities.sln -c Release -p:Version=${{ steps.version.outputs.version }}

      - name: Test
        run: dotnet test tests/Shaker.SQLLiteDB.Activities.Tests/Shaker.SQLLiteDB.Activities.Tests.csproj -c Release --no-build

      - name: Pack
        run: dotnet pack src/Shaker.SQLLiteDB.Activities/Shaker.SQLLiteDB.Activities.csproj -c Release --no-build -p:Version=${{ steps.version.outputs.version }}

      - name: Checksums
        shell: bash
        run: |
          cd artifacts
          sha256sum *.nupkg *.snupkg > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Check the package layout
        shell: bash
        run: |
          # The layout Studio accepts, verified against a package Studio really does install.
          # Studio 2022.10 matches a Windows project against lib/net6.0; offering the windows
          # flavoured net6.0-windows7.0 instead makes it call the package incompatible.
          cd artifacts
          unzip -l *.nupkg | grep -E 'lib/' || true
          unzip -l *.nupkg | grep -q 'lib/net461/' || { echo 'missing lib/net461'; exit 1; }
          unzip -l *.nupkg | grep -q 'lib/net6.0/' || { echo 'missing lib/net6.0'; exit 1; }
          unzip -l *.nupkg | grep -q 'System.Activities.ViewModels.dll' && { echo 'the view models assembly is restored, never bundled'; exit 1; }
          unzip -l *.nupkg | grep -q 'net6.0-windows' && { echo 'net6.0-windows makes Studio reject the package'; exit 1; }
          unzip -p *.nupkg '*.nuspec' | grep -q 'UiPath.Workflow' && { echo 'System.Activities must not be a package dependency'; exit 1; }
          # Exactly one declared dependency is allowed: System.Activities.ViewModels, which carries the
          # designer layout and has to resolve on the robot as well, so it cannot be bundled. The
          # SQLite stack ships inside lib/ and must never turn back into a dependency.
          DEPS=$(unzip -p *.nupkg '*.nuspec' | grep '<dependency ' || true)
          echo "$DEPS"
          case "$DEPS" in
            *'id="System.Activities.ViewModels"'*) ;;
            *) echo 'the designer view models dependency is missing'; exit 1 ;;
          esac
          if [ "$(printf '%s\n' "$DEPS" | grep -c '<dependency ')" != 1 ]; then
            echo 'only System.Activities.ViewModels may be declared, in the net6.0 group; the SQLite stack is bundled in lib/'
            exit 1
          fi

          # The dependency groups themselves must stay, even though they are empty: Studio reads the
          # target frameworks from them to decide which project types the package supports, and with
          # no <dependencies> element at all it reports the package as not compatible with anything.
          unzip -p *.nupkg '*.nuspec' | grep -q 'targetFramework=".NETFramework4.6.1"' || { echo 'missing the net461 dependency group'; exit 1; }
          unzip -p *.nupkg '*.nuspec' | grep -q 'targetFramework="net6.0"' || { echo 'missing the net6.0 dependency group'; exit 1; }
          for tfm in net461 net6.0; do
            unzip -l *.nupkg | grep -q "lib/$tfm/Microsoft.Data.Sqlite.dll" || { echo "lib/$tfm is missing the bundled SQLite stack"; exit 1; }
            unzip -l *.nupkg | grep -q "lib/$tfm/e_sqlcipher.dll" || { echo "lib/$tfm is missing the native engine"; exit 1; }
          done

          # The layout NuGet itself understands. A .dll inside lib/ that is not a managed assembly is
          # skipped on restore, so without this a robot installs the package and still cannot load the
          # engine.
          for arch in x64 x86; do
            unzip -l *.nupkg | grep -q "runtimes/win-$arch/native/e_sqlcipher.dll" \
              || { echo "missing runtimes/win-$arch/native/e_sqlcipher.dll"; exit 1; }
          done

          # Studio ships System.Activities 6.0.0.0. An assembly compiled against a higher version
          # cannot be loaded by it, and Studio then reports the whole package as incompatible with
          # Windows projects, which is what happened to 1.0.1 through 1.0.3.
          grep -q 'UiPath.Workflow.Runtime" Version="6.0.0-' ../src/Shaker.SQLLiteDB.Activities/Shaker.SQLLiteDB.Activities.csproj \
            || { echo 'must compile against the 6.0.0.0 build of System.Activities'; exit 1; }
          echo 'package layout ok'

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          cat > notes.md <<'NOTES'
          UiPath activity library for SQLite. The SQLite engine ships inside the package
          (SQLitePCLRaw, SQLCipher build), so a robot needs no ODBC driver, no
          System.Data.SQLite install and no machine level configuration, and encrypted
          databases work out of the box.

          **Installing in Studio**

          1. Download `Shaker.SQLLiteDB.Activities.VERSION_PLACEHOLDER.nupkg` below into a local folder.
          2. Studio: Manage Packages -> Settings -> add that folder as a package source.
          3. Install **Shaker.SQLLiteDB.Activities**. The activities show up under Shaker -> SQLite.

          Works in both **Windows - Legacy** (`net461`) and **Windows** (`net6.0`) projects.

          **What is in it**

          * Many readers at once (WAL) plus `SQLite Parallel Query`.
          * One writer at a time, serialized through a lock file that works across
            processes and machines, with retries for the busy/locked errors.
          * Connect, transaction and write lock scopes; query, scalar, non query, script
            and batch; bulk insert with ignore/replace/upsert.
          * Export to CSV, XLSX and JSON, and CSV import. The .xlsx writer is built into
            the package, so no Open XML library is pulled into your project.
          * Schema inspection, create table, maintenance, online backup, attach.
          * AES-256 encryption: set `Password`, or use `SQLite Set Password` to encrypt,
            re-key or decrypt a database.

          Verify the download against `SHA256SUMS.txt`.
          NOTES
          sed -i "s/VERSION_PLACEHOLDER/${VERSION}/g" notes.md

          # --target creates the tag from this commit when it does not exist yet, so the
          # release can also be published straight from the Actions tab.
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "Shaker SQLite Activities $TAG" \
            --notes-file notes.md \
            artifacts/*.nupkg artifacts/*.snupkg artifacts/SHA256SUMS.txt
